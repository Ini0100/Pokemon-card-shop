<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Fundas básicas para cartas">
  <defs>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c7cff"/>
      <stop offset="1" stop-color="#3a35c4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.65" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <ellipse cx="200" cy="440" rx="130" ry="16" fill="#000" opacity="0.15"/>

  <!-- Stack of sleeves fanned out -->
  <g transform="translate(200 255)">
    <rect x="-95" y="-135" width="190" height="265" rx="14" fill="url(#sleeve)" opacity="0.55" transform="rotate(-12)"/>
    <rect x="-95" y="-135" width="190" height="265" rx="14" fill="url(#sleeve)" opacity="0.75" transform="rotate(-5)"/>
    <g transform="rotate(4)">
      <rect x="-95" y="-135" width="190" height="265" rx="14" fill="url(#sleeve)"/>
      <!-- Open top edge of the sleeve -->
      <rect x="-95" y="-135" width="190" height="16" rx="8" fill="#fff" opacity="0.25"/>
      <rect x="-80" y="-112" width="160" height="230" rx="8" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="3"/>
      <rect x="-95" y="-135" width="190" height="265" rx="14" fill="url(#sheen)"/>
      <!-- Label -->
      <rect x="-62" y="40" width="124" height="44" rx="22" fill="#ffd23f"/>
      <text x="0" y="69" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900"
            font-size="17" fill="#1b1a10">60 FUNDAS</text>
    </g>
  </g>
</svg>
