<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Fundas Perfect Fit para cartas">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5cff"/>
      <stop offset="0.55" stop-color="#3a35c4"/>
      <stop offset="1" stop-color="#191654"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.3" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.56" stop-color="#cfe9ff" stop-opacity="0.25"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <ellipse cx="200" cy="440" rx="120" ry="16" fill="#000" opacity="0.15"/>

  <g transform="translate(200 255) rotate(-4)">
    <!-- Card inside (generic card back) -->
    <rect x="-86" y="-122" width="172" height="240" rx="10" fill="url(#card)"/>
    <rect x="-74" y="-110" width="148" height="216" rx="6" fill="none" stroke="#ffd23f" stroke-width="4"/>
    <circle cx="0" cy="-4" r="36" fill="none" stroke="#ffd23f" stroke-width="5"/>
    <path d="M0 -30 l8 16 18 3 -13 12 3 18 -16 -9 -16 9 3 -18 -13 -12 18 -3 z" fill="#ffd23f"/>

    <!-- Tight, crystal-clear sleeve -->
    <rect x="-92" y="-128" width="184" height="250" rx="13" fill="#e8f3ff" fill-opacity="0.18"
          stroke="#fff" stroke-opacity="0.9" stroke-width="3"/>
    <rect x="-92" y="-128" width="184" height="250" rx="13" fill="url(#sheen)"/>
    <path d="M-92 -112 H92" stroke="#fff" stroke-opacity="0.7" stroke-width="2"/>
  </g>

  <!-- Label -->
  <rect x="120" y="390" width="160" height="40" rx="20" fill="#151827"/>
  <text x="200" y="416" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="15" letter-spacing="2" fill="#fff">PERFECT FIT</text>
</svg>
