<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Caja básica para cartas">
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b5bf6"/>
      <stop offset="1" stop-color="#3a35c4"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a35c4"/>
      <stop offset="1" stop-color="#231f86"/>
    </linearGradient>
  </defs>

  <ellipse cx="215" cy="430" rx="135" ry="18" fill="#000" opacity="0.15"/>

  <!-- Deck box: right side, top, front -->
  <polygon points="290,170 330,130 330,380 290,420" fill="url(#side)"/>
  <polygon points="110,170 150,130 330,130 290,170" fill="#8a8aff"/>
  <rect x="110" y="170" width="180" height="250" rx="6" fill="url(#front)"/>

  <!-- Lid -->
  <rect x="110" y="170" width="180" height="62" rx="6" fill="#4643e2"/>
  <polygon points="290,170 330,130 330,192 290,232" fill="#2b2799"/>
  <path d="M176 232 a24 24 0 0 0 48 0 Z" fill="#3a35c4"/>

  <!-- Emblem -->
  <circle cx="200" cy="315" r="44" fill="none" stroke="#ffd23f" stroke-width="6"/>
  <path d="M200 285 l9 19 21 3 -15 15 4 21 -19 -10 -19 10 4 -21 -15 -15 21 -3 z" fill="#ffd23f"/>
  <text x="200" y="395" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="16" letter-spacing="3" fill="#fff">DECK BOX</text>

  <!-- Highlight -->
  <rect x="118" y="244" width="10" height="160" rx="5" fill="#fff" opacity="0.18"/>
</svg>
