<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Dado de 20 caras de tipo Agua">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fd3ff"/>
      <stop offset="1" stop-color="#1468c7"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8f0ff"/>
      <stop offset="1" stop-color="#4bb6f2"/>
    </linearGradient>
  </defs>

  <ellipse cx="200" cy="425" rx="130" ry="18" fill="#000" opacity="0.15"/>

  <!-- Icosahedron silhouette (regular hexagon) -->
  <polygon points="200,105 330,180 330,330 200,405 70,330 70,180"
           fill="url(#body)" stroke="#0e4f9a" stroke-width="8" stroke-linejoin="round"/>

  <!-- Side facets, slightly shaded -->
  <polygon points="200,105 330,180 200,160" fill="#fff" opacity="0.25"/>
  <polygon points="200,105 70,180 200,160" fill="#fff" opacity="0.15"/>
  <polygon points="330,180 330,330 290,315" fill="#000" opacity="0.12"/>
  <polygon points="70,180 70,330 110,315" fill="#fff" opacity="0.1"/>
  <polygon points="330,330 200,405 290,315" fill="#000" opacity="0.18"/>
  <polygon points="70,330 200,405 110,315" fill="#000" opacity="0.08"/>

  <!-- Front face -->
  <polygon points="200,160 290,315 110,315" fill="url(#front)" stroke="#0e4f9a" stroke-width="6" stroke-linejoin="round"/>

  <!-- Facet edges -->
  <g stroke="#0e4f9a" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M200 105 L200 160"/>
    <path d="M330 180 L200 160 M330 180 L290 315"/>
    <path d="M330 330 L290 315"/>
    <path d="M200 405 L290 315 M200 405 L110 315"/>
    <path d="M70 330 L110 315"/>
    <path d="M70 180 L110 315 M70 180 L200 160"/>
  </g>

  <!-- Water drop + number on the front face -->
  <path d="M200 190 C188 210 182 220 182 230 a18 18 0 0 0 36 0 C218 220 212 210 200 190 Z" fill="#0e4f9a" opacity="0.8"/>
  <text x="200" y="292" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="44" fill="#0e3f7a">20</text>
</svg>
